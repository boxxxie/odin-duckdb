name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check library package syntax & types
        run: odin check duckdb -no-entry-point

      - name: Check ATDD specification suite syntax & types
        run: |
          odin check tests -no-entry-point
          odin check tests -no-entry-point -define:DUCKDB_V2_STATS=true

      - name: Check benchmark suite syntax & types
        run: odin check benchmarks

      - name: Run ATDD specification suite (when libduckdb is installed)
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep -q libduckdb; then
            odin test tests
          else
            echo "libduckdb not preinstalled on runner; skipping link/runtime test step"
          fi

