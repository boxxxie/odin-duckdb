name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout runa
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: boxxxie/runa
          ref: main
          path: .tmp/runa
          persist-credentials: false

      - name: Checkout hugi v0.2.0 (runner only)
        uses: actions/checkout@v4
        with:
          repository: boxxxie/hugi
          ref: v0.2.0
          path: .tmp/hugi
          persist-credentials: false

      - name: Init hugi obench submodule
        run: git -C .tmp/hugi submodule update --init deps/obench

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check library package syntax & types
        run: odin check duckdb -no-entry-point

      - name: Check ATDD specification suite syntax & types
        run: |
          odin check tests -no-entry-point
          odin check tests -no-entry-point -define:DUCKDB_V2_STATS=true

      - name: Check benchmark suite syntax & types
        run: odin check benchmarks -collection:hugi=.tmp/hugi/hugi -collection:obench=.tmp/hugi/deps/obench/obench

      - name: Verify runa benchmark renderer (Linux)
        if: runner.os == 'Linux'
        run: |
          odin run .tmp/runa/cli -- --check --warn-unused benchmarks/render -out:benchmarks/render/templates_gen.odin -pkg:bench_render -runa-import:runa:.
          odin check benchmarks/render -collection:runa=.tmp/runa -vet -strict-style -vet-tabs -warnings-as-errors -vet-packages:bench_render
          odin test benchmarks/render -collection:runa=.tmp/runa -vet -strict-style -vet-tabs -warnings-as-errors -vet-packages:bench_render -define:ODIN_TEST_FANCY=false -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true

      - name: Run ATDD specification suite (when libduckdb is installed)
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep -q libduckdb; then
            odin test tests
          else
            echo "libduckdb not preinstalled on runner; skipping link/runtime test step"
          fi

